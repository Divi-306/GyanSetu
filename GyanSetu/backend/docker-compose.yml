services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gyansetu
      POSTGRES_PASSWORD: gyansetu
      POSTGRES_DB: gyansetu
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: gyansetu
      POSTGRES_PASSWORD: gyansetu
      POSTGRES_DB: gyansetu_test
    ports:
      - "5434:5432"

volumes:
  pgdata: {}
